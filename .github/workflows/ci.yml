name: Ore & Order source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Build production bundle
        run: npm run build
      - name: Install Playwright for preview gameplay tests
        run: npm install --no-save --no-audit --no-fund @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Quality Control on local preview
        run: npx playwright test --config=playwright.preview.config.mjs

