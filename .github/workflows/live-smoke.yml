name: Ore & Order live Cloudflare smoke tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test live Cloudflare site
        env:
          LIVE_URL: https://game-v1.joebh101.workers.dev/
        run: npx playwright test --config=playwright.live.config.mjs
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-live-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
